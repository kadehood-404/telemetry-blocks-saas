<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Telemetry UI System Showcase</title>
  <style>
    body { background: #020617; color: #f8fafc; padding: 40px; font-family: sans-serif; }
    .grid { display: flex; gap: 20px; max-width: 900px; margin-top: 20px; align-items: flex-start; }
  </style>
</head>
<body>

  <h1>Live Telemetry Blocks Showcase</h1>
  <p>Interactive web components streaming updates natively without virtual DOM overhead.</p>

  <div class="grid">
    <!-- Component 1: Card block from previous step -->
    <telemetry-card id="ggr-counter"><span slot="title">Incoming Operations/sec</span></telemetry-card>
    
    <!-- Component 2: High performance canvas chart engine -->
    <telemetry-chart id="ggr-stream-chart"></telemetry-chart>
  </div>

  <script src="telemetry-card.js"></script>
  <script src="telemetry-chart.js"></script>
  
    <script>
    const cardNode = document.getElementById('ggr-counter');
    const chartNode = document.getElementById('ggr-stream-chart');
    
    async function fetchLiveMetrics() {
      try {
        const response = await fetch('/api/live');
        const data = await response.json();
        
        // Pass the actual client data received by the server to your elements
        cardNode.setAttribute('value', data.value);
        chartNode.setAttribute('stream-value', data.value);
      } catch (err) {
        console.error("Dashboard connection dropped:", err);
      }
    }

    // Continuously check the server for fresh client metrics every 200ms
    setInterval(fetchLiveMetrics, 200);
  </script>

</body>
</html>
