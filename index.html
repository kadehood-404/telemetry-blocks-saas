<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetry UI System Showcase</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: monospace; }
        .glow { box-shadow: 0 0 20px rgba(16, 185, 129, 0.15); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <main class="w-full max-w-4xl space-y-8">
        <!-- Header Showcase Info -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold tracking-tight text-emerald-400">Live Telemetry Blocks Showcase</h1>
            <p class="text-gray-400 max-w-xl mx-auto text-sm">
                Interactive web components streaming system updates natively without virtual DOM overhead.
            </p>
        </div>

        <!-- Dashboard Grid Layout -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Metric Card Component Block -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-5 glow flex flex-col justify-between h-40">
                <span class="text-xs uppercase tracking-wider text-gray-500 font-bold">Incoming Operations/Sec</span>
                <div class="flex items-baseline space-x-2">
                    <span id="ops-counter" class="text-4xl font-extrabold text-emerald-400 tracking-tight">0</span>
                    <span class="text-xs text-emerald-500/80 animate-pulse">● LIVE</span>
                </div>
                <div class="w-full bg-slate-800/50 rounded-full h-1.5 overflow-hidden">
                    <div id="ops-progress" class="bg-emerald-500 h-1.5 rounded-full transition-all duration-200" style="width: 0%"></div>
                </div>
            </div>

            <!-- Canvas Real-Time Chart Block -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-5 glow md:col-span-2 flex flex-col space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs uppercase tracking-wider text-gray-500 font-bold">System Throughput Stream</span>
                    <span id="chart-status" class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded">16ms tick</span>
                </div>
                <div class="relative w-full h-28 bg-slate-950/80 rounded-lg border border-slate-900 overflow-hidden">
                    <canvas id="telemetryCanvas" class="absolute top-0 left-0 w-full h-full"></canvas>
                </div>
            </div>
        </div>

        <!-- CTA Action Block (Funnel Hook) -->
        <div class="bg-gradient-to-r from-slate-900 via-emerald-950/20 to-slate-900 border border-slate-800/80 rounded-xl p-6 text-center space-y-4">
            <p class="text-xs text-gray-400">Want framework variants or persistent cluster configurations?</p>
            <div class="flex justify-center gap-4">
                <button onclick="navigator.clipboard.writeText(document.documentElement.outerHTML)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-gray-200 rounded-lg text-xs font-bold transition cursor-pointer">
                    Copy Block Source
                </button>
                <button class="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-lg text-xs font-bold transition shadow-lg shadow-emerald-500/20 cursor-pointer">
                    Unlock Advanced Webhooks
                </button>
            </div>
        </div>
    </main>

    <!-- Wire Modules -->
    <script src="telemetry-card.js"></script>
    <script src="telemetry-chart.js"></script>
</body>
</html>
